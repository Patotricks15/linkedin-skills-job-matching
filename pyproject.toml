[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linkedin-skills-job-matching"
version = "0.1.0"
description = "Classical two-stage BM25 + LambdaMART retrieval-and-ranking for LinkedIn skills/job matching with leakage-tested point-in-time features"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "pyyaml>=6.0",
    "pyarrow>=14.0",
    "rank_bm25>=0.2.2",
    "lightgbm>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.6"]
serving = ["boto3>=1.34"]

[project.scripts]
linkedin-skills-job-matching = "recommender.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
