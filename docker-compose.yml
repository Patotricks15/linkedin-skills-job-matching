# Floci: the whole AWS surface this project uses, locally and free.
services:
  floci:
    image: floci/floci:latest
    container_name: linkedin-skills-floci
    ports:
      - "4566:4566"
    environment:
      FLOCI_STORAGE_MODE: memory
      FLOCI_DEFAULT_REGION: us-east-1
      FLOCI_SERVICES: dynamodb,events,iam,lambda,logs,s3,sts,apigateway
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
